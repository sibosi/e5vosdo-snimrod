<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07141f" />
    <meta name="description" content="Az Eötvös DÖ oldala hamarosan megújul." />
    <title>Hamarosan újra itt - E5vös DÖ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f5f8fa;
        --muted: #a4b4be;
        --surface: rgba(19, 42, 56, 0.72);
        --line: rgba(194, 220, 232, 0.15);
        --primary: #85b0d1;
        --primary-dark: #507c9a;
        --accent: #fa8f57;
        --background: #07141f;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        align-items: center;
        background:
          radial-gradient(
            circle at 14% 12%,
            rgba(80, 124, 154, 0.36),
            transparent 31rem
          ),
          radial-gradient(
            circle at 90% 86%,
            rgba(185, 93, 42, 0.24),
            transparent 28rem
          ),
          var(--background);
        color: var(--ink);
        display: flex;
        font-family: "DM Sans", sans-serif;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        padding: 32px 20px;
      }

      body::before {
        background-image:
          linear-gradient(rgba(194, 220, 232, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(194, 220, 232, 0.05) 1px, transparent 1px);
        background-size: 52px 52px;
        content: "";
        inset: 0;
        mask-image: linear-gradient(to bottom, black, transparent 75%);
        pointer-events: none;
        position: fixed;
      }

      .container {
        animation: appear 0.7s ease-out both;
        max-width: 920px;
        position: relative;
        width: 100%;
      }

      .container::after {
        border: 1px solid rgba(133, 176, 209, 0.18);
        border-radius: 50%;
        content: "";
        height: 360px;
        position: absolute;
        right: -170px;
        top: -160px;
        width: 360px;
        z-index: -1;
      }

      main {
        background: linear-gradient(
          145deg,
          rgba(24, 55, 72, 0.88),
          rgba(10, 28, 40, 0.9)
        );
        border: 1px solid var(--line);
        border-radius: 32px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
        overflow: hidden;
        padding: clamp(36px, 7vw, 78px);
        position: relative;
      }

      main::before {
        background: linear-gradient(90deg, var(--primary), var(--accent));
        content: "";
        height: 3px;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
      }

      .intro {
        align-items: center;
        display: flex;
        gap: 18px;
        margin-bottom: 60px;
      }

      .logo {
        color: var(--primary);
        filter: brightness(0) invert(1)
          drop-shadow(0 8px 18px rgba(80, 124, 154, 0.35));
        height: 58px;
        width: 58px;
      }

      .brand {
        color: var(--ink);
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .brand span {
        color: var(--accent);
      }

      .eyebrow {
        align-items: center;
        color: var(--accent);
        display: flex;
        font-size: 0.76rem;
        font-weight: 700;
        gap: 9px;
        letter-spacing: 0.16em;
        margin-bottom: 18px;
        text-transform: uppercase;
      }

      .eyebrow::before {
        background: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 0 5px rgba(250, 143, 87, 0.12);
        content: "";
        height: 7px;
        width: 7px;
      }

      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(2.75rem, 7vw, 5.6rem);
        letter-spacing: -0.075em;
        line-height: 0.98;
        max-width: 700px;
      }

      h1 strong {
        color: var(--primary);
        display: block;
        font-weight: 600;
      }

      .lead {
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
        margin-top: 25px;
        max-width: 530px;
      }

      .message {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        display: flex;
        gap: 16px;
        margin-top: 40px;
        padding: 18px 20px;
      }

      .message-icon {
        align-items: center;
        background: rgba(133, 176, 209, 0.13);
        border-radius: 12px;
        color: var(--primary);
        display: flex;
        flex: 0 0 42px;
        height: 42px;
        justify-content: center;
      }

      .message p {
        color: #d7e2e8;
        font-size: 0.98rem;
        line-height: 1.5;
      }

      .button-container {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }

      .button {
        align-items: center;
        border-radius: 12px;
        display: inline-flex;
        font-size: 0.92rem;
        font-weight: 700;
        gap: 10px;
        justify-content: center;
        min-height: 50px;
        padding: 0 20px;
        text-decoration: none;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      .button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .instagram-button {
        background: linear-gradient(135deg, var(--primary), #6a96b5);
        box-shadow: 0 10px 24px rgba(80, 124, 154, 0.24);
        color: #07141f;
      }

      .instagram-button:hover {
        box-shadow: 0 14px 28px rgba(80, 124, 154, 0.38);
      }

      .feedback-button {
        background: transparent;
        border: 1px solid rgba(194, 220, 232, 0.25);
        color: var(--ink);
      }

      .feedback-button:hover {
        background: rgba(194, 220, 232, 0.08);
        border-color: var(--primary);
      }

      .icon {
        fill: currentColor;
        height: 18px;
        width: 18px;
      }

      footer {
        color: #7f96a3;
        font-size: 0.8rem;
        padding: 22px 4px 0;
        text-align: center;
      }

      footer a {
        color: var(--primary);
        text-decoration: none;
      }

      footer a:hover {
        color: var(--accent);
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        body {
          padding: 18px 14px;
        }
        main {
          border-radius: 24px;
          padding: 34px 24px 30px;
        }
        .intro {
          margin-bottom: 48px;
        }
        h1 {
          font-size: clamp(2.6rem, 14vw, 4rem);
        }
        .message {
          align-items: flex-start;
          margin-top: 32px;
        }
        .button-container {
          flex-direction: column;
        }
        .button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <main>
        <div class="intro">
          <img src="logo.svg" class="logo" alt="E5vös DÖ logó" />
          <p class="brand">E5vös DÖ</p>
        </div>

        <p class="eyebrow">Rövid szünet</p>
        <h1>Valami keszul...</h1>
        <p class="lead">
          Az Eötvös DÖ oldala fejlesztés alatt áll. Kérjük, nézz vissza később!
        </p>

        <div class="button-container">
          <a
            href="https://instagram.com/e5vosdo/"
            class="button instagram-button"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
              />
            </svg>
            Instagram
          </a>
          <a
            href="https://forms.gle/XdMtAx6fsubWEBW97"
            class="button feedback-button"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V5h2v6zm0 4h-2v-2h2v2z"
              />
            </svg>
            Visszajelzés küldése
          </a>
        </div>
      </main>

      <footer>
        Fejleszti:
        <a href="https://snimrod.com" target="_blank" rel="noopener noreferrer"
          >Simon Nimród</a
        >
      </footer>
    </div>
  </body>
</html>
